name: Sahayak AI Teacher CI

on:
  push:
    branches: [ main, hackathon-polish ]
  pull_request:
    branches: [ main, hackathon-polish ]

jobs:
  backend-test:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Matrix
        working-directory: ./backend
        env:
          ENV: test
          JWT_SECRET_KEY: test-secret-key-at-least-32-chars-long-2026
          DATABASE_URL: sqlite:///./sahayak_test.db
        run: |
          pytest tests/ -v

  frontend-build:
    name: Frontend Production Build (Next.js 15)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run Next.js Production Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
        run: npm run build
