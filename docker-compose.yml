# Sahayak AI Teacher — Multi-Container Stack (Postgres pgvector + FastAPI + Next.js)
version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sahayak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sahayak
      POSTGRES_USER: sahayak
      POSTGRES_PASSWORD: sahayak_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahayak -d sahayak"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sahayak-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://sahayak:sahayak_secure_password_2026@db:5432/sahayak
      MEDIA_DIR: data/media
      DOC_STORAGE_DIR: data/docs
      PORT: 8000
      HOST: "0.0.0.0"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-sahayak-production-secret-key-change-in-production-2026}
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sahayak-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: "/api"
      BACKEND_INTERNAL_URL: "http://backend:8000"
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
  app_data:
