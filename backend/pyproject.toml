[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sahayak-ai-teacher-backend"
version = "1.0.0"
description = "Sahayak AI Teacher — adaptive, document-grounded AI teaching backend (FastAPI)."
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sahayak AI Teacher" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.28",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pypdf>=4.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "plotly>=5.20.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
]

# The backend runs from source; packaging metadata is declared explicitly so that
# `pip install .` does not trip over setuptools flat-layout auto-discovery (the
# project root also contains non-package dirs like generated_media/ and uploaded_docs/).
[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "generated_media*", "uploaded_docs*", "data*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
